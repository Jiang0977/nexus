[package]
name = "nexus-rust-runtime"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Jiang0977/nexus"
[[bin]]
name = "nexus-pty-runtime"
path = "src/bin/nexus-pty-runtime.rs"

[[bin]]
name = "nexus-native-pty-supervisor"
path = "src/bin/nexus-native-pty-supervisor.rs"

[[bin]]
name = "nexus-native-session"
path = "src/bin/nexus-native-session.rs"

[[bin]]
name = "nexus-window-launch-runtime"
path = "src/bin/nexus-window-launch-runtime.rs"

[[bin]]
name = "nexus-session-runtime"
path = "src/bin/nexus-session-runtime.rs"

[[bin]]
name = "nexus-server"
path = "src/bin/nexus-server.rs"

[[bin]]
name = "nexus-codex-home"
path = "src/bin/nexus-codex-home.rs"

[[bin]]
name = "nexus-setup"
path = "src/bin/nexus-setup.rs"

[dependencies]
avt = { path = "vendor/avt" }
vte = { version = "0.15", default-features = false }
getrandom = "0.2"
anyhow = "1"
axum = { version = "0.8", features = ["json", "http1", "multipart", "ws"] }
bcrypt = "0.16"
chrono = { version = "0.4", default-features = true, features = ["clock", "serde"] }
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs"] }
mime_guess = "2"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", default-features = false, features = ["compression-br", "compression-gzip"] }

[dev-dependencies]
tempfile = "3"
